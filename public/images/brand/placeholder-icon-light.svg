<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <defs>
    <linearGradient id="phBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFF7ED" />
    </linearGradient>
    <linearGradient id="phStrokeLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#02B702" />
      <stop offset="35%" stop-color="#FFD400" />
      <stop offset="70%" stop-color="#FF6F00" />
      <stop offset="100%" stop-color="#FF0000" />
    </linearGradient>
    <pattern id="phGridLight" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#CBD5E1" fill-opacity="0.65" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="320" height="220" rx="20" fill="url(#phBgLight)" />
  <rect width="320" height="220" rx="20" fill="url(#phGridLight)" />

  <!-- Top Signature Renaissance Gradient Strip -->
  <rect x="0" y="0" width="320" height="4" fill="url(#phStrokeLight)" />

  <!-- Soft Decorative Ambient Circles -->
  <circle cx="65" cy="50" r="46" fill="#10B981" fill-opacity="0.07" />
  <circle cx="255" cy="170" r="54" fill="#FF6F00" fill-opacity="0.07" />

  <!-- Central Placeholder Emblem Container -->
  <g transform="translate(104, 34)">
    <rect x="0" y="0" width="112" height="112" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <rect x="6" y="6" width="100" height="100" rx="22" fill="#F8FAFC" stroke="url(#phStrokeLight)" stroke-width="1.8" stroke-dasharray="6 4" />

    <!-- QR Scanner Corner Brackets -->
    <path d="M18 32 V22 C18 19.7909 19.7909 18 22 18 H32" stroke="#02B702" stroke-width="3" stroke-linecap="round" />
    <path d="M80 18 H90 C92.2091 18 94 19.7909 94 22 V32" stroke="#FF6F00" stroke-width="3" stroke-linecap="round" />
    <path d="M18 80 V90 C18 92.2091 19.7909 94 22 94 H32" stroke="#059669" stroke-width="3" stroke-linecap="round" />
    <path d="M94 80 V90 C94 92.2091 92.2091 94 90 94 H80" stroke="#FF0000" stroke-width="3" stroke-linecap="round" />

    <!-- Serving Cloche / Food Order Icon in Center -->
    <circle cx="56" cy="34" r="3.5" fill="#FFD400" stroke="#FF6F00" stroke-width="1.8" />
    <path d="M32 60 C32 46.7452 42.7452 36 56 36 C69.2548 36 80 46.7452 80 60" stroke="#047857" stroke-width="3.2" stroke-linecap="round" fill="#ECFDF5" />
    <line x1="27" y1="64" x2="85" y2="64" stroke="#0F172A" stroke-width="3.2" stroke-linecap="round" />
    <path d="M35 69 H77" stroke="#FF6F00" stroke-width="2.5" stroke-linecap="round" />

    <!-- Mini QR Squares Embedded on Cloche -->
    <rect x="47" y="46" width="6" height="6" rx="1.2" fill="#02B702" />
    <rect x="59" y="46" width="6" height="6" rx="1.2" fill="#FF6F00" />
    <rect x="47" y="54" width="6" height="4" rx="1" fill="#059669" />
    <rect x="59" y="54" width="6" height="4" rx="1" fill="#FFD400" />
  </g>

  <!-- Label Pill Below Icon -->
  <rect x="82" y="158" width="156" height="24" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
  <circle cx="96" cy="170" r="3.5" fill="#02B702" />
  <text x="106" y="174" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.5" fill="#0F172A">RENAISSANCE EVENT</text>

  <text x="160" y="198" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#64748B">QR Gate &amp; Catering Visual Placeholder</text>
</svg>
