<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" fill="none">
  <defs>
    <!-- Signature Renaissance Multi-Stop Gradient: Green -> Yellow -> Orange -> Red -->
    <linearGradient id="renBrandGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02B702" />
      <stop offset="38%" stop-color="#10B981" />
      <stop offset="68%" stop-color="#FFD400" />
      <stop offset="86%" stop-color="#FF6F00" />
      <stop offset="100%" stop-color="#FF0000" />
    </linearGradient>
    <linearGradient id="renAccentGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#02B702" />
      <stop offset="35%" stop-color="#FFD400" />
      <stop offset="70%" stop-color="#FF6F00" />
      <stop offset="100%" stop-color="#FF0000" />
    </linearGradient>
    <linearGradient id="renClocheGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>
    <filter id="softShadowLight" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Badge -->
  <g filter="url(#softShadowLight)">
    <rect x="8" y="8" width="80" height="80" rx="22" fill="#FFFFFF" stroke="url(#renBrandGradLight)" stroke-width="3.5" />
    <rect x="13" y="13" width="70" height="70" rx="17" fill="#F0FDF4" fill-opacity="0.65" />
  </g>

  <!-- QR Scanner Corner Brackets Inside Emblem -->
  <path d="M22 33 V25 C22 23.3431 23.3431 22 25 22 H33" stroke="#02B702" stroke-width="3" stroke-linecap="round" />
  <path d="M63 22 H71 C72.6569 22 74 23.3431 74 25 V33" stroke="#FF6F00" stroke-width="3" stroke-linecap="round" />
  <path d="M22 63 V71 C22 72.6569 23.3431 74 25 74 H33" stroke="#059669" stroke-width="3" stroke-linecap="round" />
  <path d="M74 63 V71 C74 72.6569 72.6569 74 71 74 H63" stroke="#FF0000" stroke-width="3" stroke-linecap="round" />

  <!-- QR Data Matrix Micro-Nodes (Top Right & Bottom Left) -->
  <rect x="64" y="27" width="4.5" height="4.5" rx="1" fill="#FF6F00" />
  <rect x="27" y="64" width="4.5" height="4.5" rx="1" fill="#02B702" />

  <!-- Festive Food Cloche / Serving Dome + Monogram 'R' -->
  <!-- Cloche Top Ring -->
  <circle cx="48" cy="27" r="2.8" fill="#FFD400" stroke="#FF6F00" stroke-width="1.5" />
  <!-- Cloche Dome Arc -->
  <path d="M31 46 C31 36.6 38.6 30 48 30 C57.4 30 65 36.6 65 46" stroke="url(#renAccentGradLight)" stroke-width="3" stroke-linecap="round" fill="none" />
  <!-- Platter Base Line -->
  <path d="M27 49 H69" stroke="#047857" stroke-width="2.8" stroke-linecap="round" />

  <!-- Bold Stylized 'R' Monogram Anchored Below Dome -->
  <path d="M38 38 H49.5 C53.5 38 56 40.3 56 43.8 C56 46.8 54 48.8 50.8 49.4 L57 59 H51.2 L45.8 50 H43 V59 H38 V38 Z M43 42.2 V46.2 H48.8 C50.5 46.2 51.4 45.3 51.4 44.2 C51.4 43.1 50.5 42.2 48.8 42.2 H43 Z" fill="#064E3B" />

  <!-- Laser Scan Pulse Line Across Emblem -->
  <line x1="25" y1="62" x2="71" y2="62" stroke="url(#renAccentGradLight)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3" />

  <!-- Wordmark Section (Light Mode: Dark Slate Typography) -->
  <g transform="translate(104, 0)">
    <!-- Top Pill Tag -->
    <rect x="0" y="15" width="154" height="19" rx="9.5" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
    <circle cx="10" cy="24.5" r="3" fill="#02B702" />
    <circle cx="18" cy="24.5" r="3" fill="#FFD400" />
    <circle cx="26" cy="24.5" r="3" fill="#FF6F00" />
    <circle cx="34" cy="24.5" r="3" fill="#FF0000" />
    <text x="43" y="28" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.8" fill="#047857">END OF YEAR EVENT</text>

    <!-- Main Brand Title -->
    <text x="0" y="59" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="900" letter-spacing="-0.8" fill="#0F172A">RENAISSANCE</text>
    <!-- Accent Dot -->
    <circle cx="206" cy="54" r="4" fill="#FF6F00" />

    <!-- Subtitle: QR Scanner & Food Order Processing -->
    <text x="0" y="77" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.3" fill="#475569">QR GATE SCANNER &amp; FOOD ORDER SUITE</text>

    <!-- Bottom Signature Multi-Color Accent Bar -->
    <rect x="0" y="83" width="95" height="3" rx="1.5" fill="url(#renAccentGradLight)" />
  </g>
</svg>
