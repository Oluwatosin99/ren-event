<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 112" width="420" height="112" fill="none">
  <defs>
    <!-- Continuous Horizontal Shield Blend (Luminous Dark Mode) -->
    <linearGradient id="shieldSuitGradD" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="55%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <linearGradient id="lapelInnerGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="55%" stop-color="#FFD400" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="shieldAgbadaGradD" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#FFD400" />
      <stop offset="55%" stop-color="#FF6F00" />
      <stop offset="100%" stop-color="#FF2A2A" />
    </linearGradient>
    <filter id="shieldGlowD" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#10B981" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- =================================================================== -->
  <!-- SHIELD CREST: LEFT = TUXEDO & BOWTIE | RIGHT = AFRICAN AGBADA       -->
  <!-- =================================================================== -->
  <g transform="translate(8, 6)" filter="url(#shieldGlowD)">
    <!-- Left Half of Shield: Tuxedo Outer Shoulder -->
    <path d="M10 28 L35 16 L28 31 L34 35 L28 41 L51 89 L51 96 C26 84 13 60 10 28 Z" fill="url(#shieldSuitGradD)" />
    <!-- Left Notched Tuxedo Lapel -->
    <path d="M37 14 L42 10 L51 84 L31 41 L37 35 L31 31 L37 14 Z" fill="url(#lapelInnerGradD)" />
    <!-- Left Collar Tip -->
    <path d="M43 10 H51 V21 C47 21 44 17 43 10 Z" fill="url(#lapelInnerGradD)" />
    <!-- Left Half Bowtie -->
    <path d="M40 22 L49 26 V30 L40 34 C39 30 39 26 40 22 Z" fill="#34D399" />
    <rect x="48.5" y="25.5" width="3" height="5" rx="1" fill="#FACC15" />
    <!-- 3 Tuxedo Shirt Studs -->
    <circle cx="49.5" cy="42" r="2" fill="#34D399" />
    <circle cx="49.5" cy="54" r="2" fill="#A3E635" />
    <circle cx="49.5" cy="66" r="2" fill="#FACC15" />

    <!-- Right Half of Shield: African Agbada Flowing Robe & Geometric Chest Embroidery -->
    <path d="M53 23 C58 23 62 19 63 14 L67 16 V75 L53 89 V23 Z" fill="url(#shieldAgbadaGradD)" />
    <!-- Dark Slate Negative-Space Geometric Embroidery Lines & Chevrons -->
    <path d="M54 27 C58 27 61 24 63 20 V52 L54 61" stroke="#090D16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M58 29 V49 L54 53" stroke="#090D16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M54 66 L63 57 M54 72 L63 63 M54 78 L63 69" stroke="#090D16" stroke-width="2.2" stroke-linecap="round" />

    <!-- Agbada Flowing Outer Robe Panel & Pleat -->
    <path d="M70 17 L85 23 L86 44 L89 25 L98 29 C95 57 84 79 53 96 V91 L69 76 V17 Z" fill="url(#shieldAgbadaGradD)" />
  </g>

  <!-- =================================================================== -->
  <!-- TYPOGRAPHY: RenGala • END OF YEAR EVENT                             -->
  <!-- =================================================================== -->
  <g transform="translate(124, 0)">
    <text x="0" y="64" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="900" letter-spacing="-1.4" fill="#FFFFFF">RenGala</text>
    <text x="2" y="88" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" letter-spacing="3.6" fill="#CBD5E1">END OF YEAR EVENT</text>
  </g>
</svg>
